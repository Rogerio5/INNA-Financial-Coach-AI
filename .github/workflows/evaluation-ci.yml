name: INNA LLMOps evaluation

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "src/evaluation/**"
      - "tests/evaluations/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/evaluation-ci.yml"

  push:
    branches:
      - main
    paths:
      - "src/evaluation/**"
      - "tests/evaluations/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/evaluation-ci.yml"

permissions:
  contents: read

concurrency:
  group: inna-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-validation:
    name: LLMOps evaluation validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_HITL_E2E_TESTS: "0"
      RUN_LIVE_GEMINI_TESTS: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Display tool versions
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pytest --version
          python -m ruff --version
          python -m pip show deepeval

      - name: Compile evaluation modules
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall \
            -q \
            src/evaluation \
            tests/evaluations

      - name: Run Ruff
        shell: bash
        run: |
          set -euo pipefail

          python -m ruff check \
            src/evaluation \
            tests/evaluations

      - name: Run evaluation tests
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest \
            tests/evaluations \
            -q

      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q

      - name: Run official Quality Gate
        id: quality_gate
        shell: bash
        run: |
          set +e

          mkdir -p artifacts/evaluation-ci

          python -m src.evaluation run-official \
            --output-directory artifacts/evaluation-ci \
            --summary-only \
            --minimum-pass-rate 1.0 \
            --maximum-failed-cases 0 \
            --maximum-blocked-cases 0 \
            --maximum-error-cases 0 \
            --maximum-total-cost 0

          exit_code=$?

          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"

          if [ "${exit_code}" -eq 0 ]; then
            echo "Quality Gate aprovado."
          else
            echo "Quality Gate reprovado com código ${exit_code}."
          fi

          exit 0

      - name: Validate external report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          reports = tuple(
              Path("artifacts/evaluation-ci").glob("*.json")
          )

          if len(reports) != 1:
              raise SystemExit(
                  "Era esperado exatamente um relatório externo."
              )

          report_path = reports[0]
          payload = json.loads(
              report_path.read_text(encoding="utf-8")
          )

          required_keys = {
              "schema_version",
              "report_type",
              "run_reference",
              "generated_date",
              "batch",
              "summary",
              "quality_gate",
          }

          missing = required_keys - set(payload)

          if missing:
              raise SystemExit(
                  "Campos ausentes no relatório: "
                  + ", ".join(sorted(missing))
              )

          batch = payload["batch"]
          gate = payload["quality_gate"]

          assert payload["generated_at"] is None
          assert batch["batch_id"] is None
          assert batch["started_at"] is None
          assert batch["finished_at"] is None
          assert gate["batch_id"] is None

          assert payload["run_reference"].startswith("run-")
          assert batch["run_reference"] == payload["run_reference"]
          assert gate["run_reference"] == payload["run_reference"]

          print(
              "EXTERNAL_EVALUATION_REPORT_VALIDATED:",
              report_path,
          )
          PY

      - name: Upload sanitized evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inna-evaluation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evaluation-ci/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Quality Gate result
        if: always()
        shell: bash
        env:
          QUALITY_GATE_EXIT_CODE: ${{ steps.quality_gate.outputs.exit_code }}
        run: |
          set -euo pipefail

          if [ -z "${QUALITY_GATE_EXIT_CODE}" ]; then
            echo "O Quality Gate não produziu código de saída."
            exit 1
          fi

          if [ "${QUALITY_GATE_EXIT_CODE}" -ne 0 ]; then
            echo "O Quality Gate bloqueou esta alteração."
            exit "${QUALITY_GATE_EXIT_CODE}"
          fi

          echo "Quality Gate aprovado."
