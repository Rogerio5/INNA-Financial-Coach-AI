name: Telegram Observability Validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Valida contratos Python, SLOs, regras Prometheus e dashboard Grafana do canal Telegram"
        required: true
        type: choice
        options:
          - CANCEL
          - RUN
        default: CANCEL

  pull_request:
    paths:
      - "prometheus/**"
      - "grafana/**"
      - "src/services/telegram_observability/**"
      - "tests/unit/test_telegram_*"
      - "tests/unit/simulacao/test_telegram_*"
      - "tests/unit/contratos/test_telegram_*"
      - "requirements.txt"
      - ".github/workflows/telegram-observability-validation.yml"

  push:
    branches:
      - main
      - feature/inna-agent-core
    paths:
      - "prometheus/**"
      - "grafana/**"
      - "src/services/telegram_observability/**"
      - "tests/unit/test_telegram_*"
      - "tests/unit/simulacao/test_telegram_*"
      - "tests/unit/contratos/test_telegram_*"
      - "requirements.txt"
      - ".github/workflows/telegram-observability-validation.yml"

permissions:
  contents: read

concurrency:
  group: telegram-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    name: Telegram Observability Python Contracts
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirmation == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Telegram observability contracts
        run: |
          pytest \
            tests/unit/contratos/test_telegram_error_category_contract_alignment.py \
            tests/unit/test_telegram_operational_slo_policy.py \
            tests/unit/contratos/test_telegram_prometheus_rules_contract.py \
            tests/unit/test_telegram_prometheus_semantic_bindings.py \
            tests/unit/contratos/test_telegram_grafana_dashboard_contract.py \
            -q

  prometheus-rules:
    name: Telegram Prometheus Rules Validation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirmation == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Prometheus
        env:
          PROMETHEUS_VERSION: "2.53.5"
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --output prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"

          tar \
            --extract \
            --gzip \
            --file prometheus.tar.gz

          sudo install \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" \
            /usr/local/bin/promtool

          promtool --version

      - name: Validate Telegram recording rules
        run: |
          promtool check rules \
            prometheus/telegram_recording_rules.yml

      - name: Validate Telegram alert rules
        run: |
          promtool check rules \
            prometheus/telegram_alert_rules.yml
