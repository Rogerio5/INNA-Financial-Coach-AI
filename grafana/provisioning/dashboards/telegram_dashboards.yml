apiVersion: 1

providers:
  - name: INNA Telegram
    orgId: 1
    folder: INNA
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/inna
      foldersFromFilesStructure: false
