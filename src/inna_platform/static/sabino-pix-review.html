<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conferência Pix | Sabino.AI</title><link rel="stylesheet" href="/static/css/sabino-commerce.css"><link rel="stylesheet" href="/static/css/sabino-pix-review.css"><script defer src="/static/js/sabino-pix-review.js"></script></head>
<body><header class="top"><a class="brand" href="/dashboard">Sabino<span>.AI</span></a><a href="/static/sabino-pix.html">Meus pedidos</a></header><main><h1>Conferência de Pix</h1><p>Confira o recebimento no extrato da conta recebedora antes de liberar o pedido. Um comprovante enviado pelo cliente não confirma o crédito no banco.</p><button id="refresh" class="button secondary">Atualizar pendências</button><p id="status" role="status"></p><section id="orders"></section>
<section id="review" class="panel" hidden><h2>Conferir pedido</h2><p id="selected"></p><form id="form"><p><label>Identificador da transação no extrato (EndToEndId)<br><input id="bank" required minlength="8" maxlength="120" autocomplete="off"></label></p><p><label>Valor recebido em reais<br><input id="amount" required inputmode="decimal" placeholder="19,90" pattern="[0-9]+([.,][0-9]{1,2})?"></label></p><p><label>Observações da conferência<br><textarea id="reason" required minlength="10" maxlength="2000"></textarea></label></p><p><label><input id="verified" type="checkbox" required> Conferi no extrato o recebimento, o valor e a correspondência com este pedido.</label></p><button id="approve" class="button primary">Confirmar recebimento e liberar</button><button id="cancel" type="button" class="button secondary">Voltar</button></form><p id="result" role="status"></p></section></main></body></html>
