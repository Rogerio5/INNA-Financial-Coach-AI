[build-system]
requires = [
    "setuptools>=77.0.3",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "inna-relationship-graph"
version = "0.1.0"
description = "Componente Streamlit v2 para visualização do grafo de relacionamentos da INNA."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.54,<2"
]

[tool.setuptools.packages.find]
include = [
    "inna_relationship_graph*"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
inna_relationship_graph = [
    "frontend/build/**/*",
    "pyproject.toml"
]
