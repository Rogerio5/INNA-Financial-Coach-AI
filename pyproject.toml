[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_functions = [
    "test_*",
]
addopts = [
    "-ra",
]
markers = [
    "integration: testes que usam serviços externos ou infraestrutura real",
    "live: testes explicitamente habilitados contra serviços reais",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.black]
line-length = 88
target-version = [
    "py311",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "^\\.venv/",
    "^venv/",
]

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "psycopg.*",
    "streamlit.*",
]
ignore_missing_imports = true
